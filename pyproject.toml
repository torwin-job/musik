[project]
name = "musik"
version = "0.1.0"
description = "Умный локальный плеер — рекомендательная система (ТЗ 3.0)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47.0",
  "numpy>=2.0.0",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "pyloudnorm>=0.1.1",
  "tinytag>=1.10.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "watchdog>=4.0.0",
  "pydantic-settings>=2.6.0",
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# chromaprint system package required for fingerprinting (pyacoustid)
fingerprint = ["pyacoustid>=1.3.0"]

[project.scripts]
musik = "musik.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
