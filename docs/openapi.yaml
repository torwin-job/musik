openapi: 3.0.3
info:
  title: musik API
  version: 1.0.0
  description: Music player API. Legacy single-user password/token auth or invite-gated multi-user (local
    accounts, optional OIDC) with revocable browser sessions and user-owned device bearer tokens. In multi-user
    mode device tokens are fixed to one owned profile and cannot manage accounts, tokens or shared-library
    jobs. Browser state changes require X-CSRF-Token. The Python worker owns Alembic migrations for SQLite
    or PostgreSQL; the Go player validates the migration head. Radio events remain idempotent and profile-scoped.
  x-musik-schema-version: 8
servers:
- url: http://127.0.0.1:8787
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: musik_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with the session cookie for multi-user state changes.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
    Track:
      type: object
      properties:
        id:
          type: integer
        artist:
          type: string
        title:
          type: string
        album:
          type: string
        duration:
          type: number
        stream:
          type: string
        artwork:
          type: string
        impression_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        request_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        source:
          type: string
        passport:
          $ref: '#/components/schemas/TrackPassport'
    TrackPassport:
      type: object
      description: File measurements and this profile's listening counters. Only on GET /api/tracks/{id}.
        Fields are omitted when unknown. Rating is the existing like or dislike.
      properties:
        format:
          type: string
        bitrate:
          type: integer
        sample_rate:
          type: integer
        channels:
          type: integer
        lufs:
          type: number
        bpm:
          type: number
        key:
          type: string
        mode:
          type: string
          enum:
          - major
          - minor
        year:
          type: integer
        duration:
          type: number
        genres:
          type: array
          items:
            type: string
        plays:
          type: integer
        finishes:
          type: integer
        early_skips:
          type: integer
        last_played_at:
          type: string
        rating:
          type: string
          enum:
          - like
          - dislike
    PlaybackEvent:
      type: object
      required:
      - type
      - track_id
      - session_id
      properties:
        type:
          type: string
          enum:
          - track_start
          - progress
          - track_end
          - skip
          - like
          - dislike
        event_id:
          type: string
          minLength: 1
          description: Optional for legacy mobile events; newer clients use a stable id for retries. The
            server generates an id when omitted.
        impression_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Required for new radio clients. Omission invokes the legacy unambiguous fallback.
        track_id:
          type: integer
        session_id:
          type: string
        client_id:
          type: string
        device_id:
          type: string
        position_sec:
          type: number
          minimum: 0
        duration_sec:
          type: number
          minimum: 0
        listened_sec:
          type: number
          minimum: 0
        reason:
          type: string
          enum:
          - completed
          - skipped
          - next
          - ''
    Interval:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
    MetricSlice:
      type: object
      required:
      - dimension
      - value
      - impressions
      - played
      - finished
      - early_skips
      - sufficient_sample
      properties:
        dimension:
          type: string
        value:
          type: string
        impressions:
          type: integer
        played:
          type: integer
        finished:
          type: integer
        partial:
          type: integer
        early_skips:
          type: integer
        likes:
          type: integer
        superseded:
          type: integer
        abandoned:
          type: integer
        unique_artists:
          type: integer
        finish_rate:
          type: number
        early_skip_rate:
          type: number
        likes_per_100_played:
          type: number
        artist_diversity:
          type: number
        finish_interval_95:
          $ref: '#/components/schemas/Interval'
        early_skip_interval_95:
          $ref: '#/components/schemas/Interval'
        like_interval_95:
          $ref: '#/components/schemas/Interval'
        sufficient_sample:
          type: boolean
    BaselineStatus:
      type: object
      required:
      - ready
      - observed_days
      - eligible_algorithmic_impressions
      - minimum_days
      - minimum_impressions
      properties:
        ready:
          type: boolean
        started_at:
          type: string
        observed_days:
          type: integer
        eligible_algorithmic_impressions:
          type: integer
        minimum_days:
          type: integer
          minimum: 14
        minimum_impressions:
          type: integer
          minimum: 300
    RecommendationMetrics:
      type: object
      required:
      - window_days
      - baseline
      - overall
      - breakdowns
      properties:
        window_days:
          type: integer
        baseline:
          $ref: '#/components/schemas/BaselineStatus'
        overall:
          $ref: '#/components/schemas/MetricSlice'
        breakdowns:
          type: array
          items:
            $ref: '#/components/schemas/MetricSlice'
    ListeningProfile:
      type: object
      required:
      - id
      - name
      - is_default
      properties:
        id:
          type: string
        name:
          type: string
        is_default:
          type: boolean
    ProfileName:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    InvitationRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
    DeviceToken:
      type: object
      required:
      - id
      - user_id
      - profile_id
      - profile_name
      - name
      - created_at
      - expires_at
      properties:
        id:
          type: string
        user_id:
          type: string
        profile_id:
          type: string
        profile_name:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    DeviceTokenCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        profile_id:
          type: string
          description: Optional; omitted or empty selects the user's default profile.
    DeviceTokenCreated:
      type: object
      required:
      - device
      - token
      properties:
        device:
          $ref: '#/components/schemas/DeviceToken'
        token:
          type: string
          description: Opaque secret shown only on creation or replacement.
    Plugin:
      type: object
      description: An installed plugin the player can run. The executable path is omitted.
      required:
      - id
      - capabilities
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
        name:
          type: string
        version:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum:
            - library.import_url
            - library.search
    PluginRejection:
      type: object
      description: A manifest left inactive. source is a local path for the administrator who installed it.
      required:
      - reason
      properties:
        id:
          type: string
        source:
          type: string
        reason:
          type: string
    PluginCatalog:
      type: object
      required:
      - plugins
      - rejected
      - count
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/PluginRejection'
        count:
          type: integer
          description: Number of active plugins.
    PluginImportRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 4096
          description: Address to import. One line, no control characters. Stored for the running task and omitted
            from this response, later status responses, and logs.
    PluginSearchRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          description: Search text. One line, no control characters. Kept out of logs and process arguments.
        limit:
          type: integer
          minimum: 1
          maximum: 20
          description: Maximum number of items. Defaults to 8 when omitted.
    PluginSearchItem:
      type: object
      required:
      - title
      - url
      properties:
        title:
          type: string
        artist:
          type: string
        url:
          type: string
          description: Opaque address for a later library.import_url call. The player checks text grammar only.
        duration:
          type: integer
          minimum: 0
          description: Length in seconds, when the plugin knows it.
    PluginSearchResult:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PluginSearchItem'
    PluginJob:
      type: object
      description: Admin view of a plugin task. The import URL is not a property of this object.
      required:
      - id
      - plugin_id
      - action
      - status
      - error
      - error_code
      - progress
      - result
      - downstream_job_id
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        plugin_id:
          type: string
        action:
          type: string
          enum:
          - library.import_url
        status:
          type: string
          enum:
          - pending
          - running
          - done
          - error
          - cancelled
        error:
          type: string
        error_code:
          type: string
        progress:
          type: object
          nullable: true
          description: Latest progress line, or null. The import URL is redacted from message and from each item title. items is one row per track.
          properties:
            pct:
              type: number
              minimum: 0
              maximum: 100
            phase:
              type: string
            message:
              type: string
            items:
              type: array
              maxItems: 100
              items:
                type: object
                required: [title, status]
                properties:
                  title:
                    type: string
                  status:
                    type: string
                    enum: [pending, running, done, error]
                  pct:
                    type: number
                    minimum: 0
                    maximum: 100
        result:
          type: object
          nullable: true
          description: Files the plugin wrote, or null.
          properties:
            paths:
              type: array
              items:
                type: string
              description: Library-relative paths. The player checks they stay inside MUSIK_LIBRARY before queueing
                full_rescan.
        downstream_job_id:
          type: integer
          nullable: true
          description: full_rescan job queued after a successful import. Null until that import finishes.
        created_at:
          type: string
        updated_at:
          type: string
    PluginImportAccepted:
      allOf:
      - $ref: '#/components/schemas/PluginJob'
      - type: object
        required:
        - ok
        - job_id
        properties:
          ok:
            type: boolean
          job_id:
            type: integer
            description: Same value as id.
    PluginJobList:
      type: object
      required:
      - jobs
      - count
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/PluginJob'
        count:
          type: integer
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Health
      responses:
        '200':
          description: OK
  /api/themes:
    get:
      security: []
      summary: Built-in themes plus theme packages from the themes directory
      responses:
        '200':
          description: Theme catalog
  /api/auth/login:
    post:
      security: []
      summary: 'Login: password (single-user) or username and password (multi-user local account)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                username:
                  type: string
      responses:
        '200':
          description: Sets musik_session cookie
        '401':
          description: Bad password
  /api/auth/logout:
    post:
      summary: Logout
      responses:
        '200':
          description: OK
  /api/auth/me:
    get:
      security: []
      summary: Auth status
      responses:
        '200':
          description: Browser sessions receive account/profile data. Device Bearer clients retain {ok,
            auth_enabled}; invalid device tokens receive ok=false with HTTP 200.
  /api/library:
    get:
      summary: Flat track list
      responses:
        '200':
          description: Track array
  /api/library/map:
    get:
      summary: 2D library map (UMAP over CLAP) with mood labels
      responses:
        '200':
          description: '{ready, method, updated_at, total, genres, points: [[track_id, x, y, genre, neighbour_ids...]], labels: [{id, name, color, x, y, track_ids}], transitions: [[from_id, to_id, count]] of this profile}'
  /api/library/upload:
    post:
      summary: Upload audio files into MUSIK_LIBRARY
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                path:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: '{ok, saved, skipped, count}'
  /api/artists:
    get:
      summary: Artists
      responses:
        '200':
          description: '{artists, count}'
  /api/albums:
    get:
      summary: Albums
      responses:
        '200':
          description: '{albums, count}'
  /api/tracks/{id}:
    get:
      summary: Track by id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Track
        '404':
          description: Not found
  /api/stream/{id}:
    get:
      summary: Audio stream (Range)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: q
        in: query
        description: Mobile transcode profile; omit for original media
        schema:
          type: string
          enum:
          - mobile
          - aac
          - mp3
      - name: fmt
        in: query
        description: Alias for q
        schema:
          type: string
          enum:
          - mobile
          - aac
          - mp3
      responses:
        '200':
          description: Original or transcoded audio
        '400':
          description: Invalid track id
        '404':
          description: Track or media file not found
  /api/radio/start:
    post:
      summary: Start radio session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed_track_id:
                  type: integer
                seed_artist:
                  type: string
                seed_album:
                  type: string
                proximity:
                  type: string
                  enum:
                  - closer
                  - wider
                  description: One step tighter or looser on the current radio session. Send session_id.
                session_id:
                  type: string
                station:
                  type: string
                  enum:
                  - forgotten
                  description: forgotten anchors the station on tracks with high finishes and an old last
                    play.
      responses:
        '200':
          description: session + current + queue
        '409':
          description: forgotten station has no tracks yet
  /api/play:
    post:
      summary: Fixed listen (track/artist/album/ids)
      responses:
        '200':
          description: session + tracks
  /api/events:
    post:
      summary: Playback events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackEvent'
      responses:
        '200':
          description: ok / next
        '409':
          description: Legacy fallback matched more than one pending impression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mixes:
    get:
      summary: Mix shelves
      responses:
        '200':
          description: mixes
  /api/mixes/{kind}/play:
    post:
      summary: Play mix kind
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: session
  /api/favorites:
    get:
      summary: List favorites
      responses:
        '200':
          description: tracks/artists/albums
    post:
      summary: Add favorite
      responses:
        '200':
          description: ok
    delete:
      summary: Remove favorite
      responses:
        '200':
          description: ok
  /api/favorites/toggle:
    post:
      summary: Toggle favorite
      responses:
        '200':
          description: favorited
  /api/favorites/status:
    get:
      summary: Favorite status
      responses:
        '200':
          description: favorited bool
  /api/recommend/seed:
    get:
      summary: Similar tracks to seed
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - track
          - artist
          - album
      - name: track_id
        in: query
        schema:
          type: integer
      - name: artist
        in: query
        schema:
          type: string
      - name: album
        in: query
        schema:
          type: string
      responses:
        '200':
          description: tracks
  /api/recommend/favorites:
    get:
      summary: Recommend from favorites
      responses:
        '200':
          description: Tracks, artists and albums from favorites. Liked tracks outside the cosine top stay eligible. Empty favorites return empty=true and hint.
  /api/plugins:
    get:
      summary: List installed plugins and their capabilities
      description: Admin only. Active plugins and manifests left inactive. Executable paths are omitted. The player
        does not download plugins. Device tokens cannot call this route.
      responses:
        '200':
          description: Plugin catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginCatalog'
        '503':
          description: Plugins are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plugins/{id}/import:
    post:
      summary: Import a URL with a plugin
      description: Admin only. Starts a library.import_url task. The URL is stored for the task and is omitted from
        this response and from later status responses. A successful import queues full_rescan, which scans, embeds,
        and reloads the catalog. Device tokens cannot call this route.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginImportRequest'
      responses:
        '200':
          description: Plugin job. id and job_id match. status starts as pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginImportAccepted'
        '400':
          description: url is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Plugins or the library are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plugins/{id}/search:
    post:
      summary: Search with a plugin
      description: Admin only. Synchronous library.search. The query and item URLs stay out of logs and process arguments.
        Disconnecting the client sends SIGTERM to the plugin. The timeout is shorter than a download. This route does
        not create a plugin job and does not queue full_rescan. Device tokens cannot call this route.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,62}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginSearchRequest'
      responses:
        '200':
          description: Search items. url is an opaque address for library.import_url.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSearchResult'
        '400':
          description: query or limit is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Plugin not found or library.search is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The plugin failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Plugins are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The plugin timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plugin-jobs:
    get:
      summary: List plugin jobs
      description: Admin only. Import URLs are omitted.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - running
          - done
          - error
          - cancelled
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Plugin jobs without import URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginJobList'
        '503':
          description: Plugins are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plugin-jobs/{id}:
    get:
      summary: Get plugin job status and progress
      description: Admin only. progress is the latest plugin progress line. downstream_job_id is the full_rescan job
        queued after a successful import. The import URL is omitted.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Plugin job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginJob'
        '400':
          description: bad id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Plugins are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/plugin-jobs/{id}/cancel:
    post:
      summary: Cancel a plugin job
      description: Admin only. Cancels a pending or running task. A finished task returns 409.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Plugin job after cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginJob'
        '400':
          description: bad id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Plugin job is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Plugins are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/jobs:
    get:
      summary: List jobs
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: jobs
  /api/jobs/{kind}:
    post:
      summary: Enqueue job
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: job id
  /api/share/radio:
    post:
      summary: Create public continuous MP3 radio share link
      responses:
        '200':
          description: '{url, token}'
    get:
      summary: List radio share links
      responses:
        '200':
          description: '{shares, count}'
